---
# Minimal host hardening for the bootstrap host.
# SSH settings run after the openclaw user's SSH key is already installed.
- name: SSH - Restrict root login to key-based only
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
    state: present
    validate: 'sshd -t -f %s'
  notify: Restart SSH

- name: SSH - Disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
    validate: 'sshd -t -f %s'
  notify: Restart SSH

- name: SSH - Check for Ubuntu sshd_config.d overrides
  find:
    paths: /etc/ssh/sshd_config.d/
    patterns: '*.conf'
  register: sshd_drop_ins

- name: SSH - Disable password auth in drop-ins (Ubuntu 22.04+)
  lineinfile:
    path: "{{ item.path }}"
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  loop: "{{ sshd_drop_ins.files }}"
  when: sshd_drop_ins.files | length > 0
  notify: Restart SSH
