---
# Security Configuration (UFW, Fail2Ban, SSH hardening)
# Note: port 18789 is intentionally NOT opened — Tailscale Serve handles inbound access.

- name: Configure Fail2Ban for SSH
  copy:
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5
      backend = systemd

      [sshd]
      enabled = true
      port = ssh
      filter = sshd
  notify: Restart Fail2Ban

- name: UFW - Set Default Deny Incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: UFW - Set Default Allow Outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: UFW - Allow SSH (Port 22)
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    comment: 'SSH Access'

- name: UFW - Allow Tailscale (UDP 41641)
  community.general.ufw:
    rule: allow
    port: '41641'
    proto: udp
    comment: 'Tailscale UDP'

- name: Enable UFW
  community.general.ufw:
    state: enabled

# SSH hardening — runs after the openclaw user's SSH key is already installed
- name: SSH - Restrict root login to key-based only
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
    state: present
    validate: 'sshd -t -f %s'
  notify: Restart SSH

- name: SSH - Disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
    validate: 'sshd -t -f %s'
  notify: Restart SSH

- name: SSH - Check for Ubuntu sshd_config.d overrides
  find:
    paths: /etc/ssh/sshd_config.d/
    patterns: '*.conf'
  register: sshd_drop_ins

- name: SSH - Disable password auth in drop-ins (Ubuntu 22.04+)
  lineinfile:
    path: "{{ item.path }}"
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  loop: "{{ sshd_drop_ins.files }}"
  when: sshd_drop_ins.files | length > 0
  notify: Restart SSH
