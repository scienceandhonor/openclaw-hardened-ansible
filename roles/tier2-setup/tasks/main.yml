---
# Tier 2: Direct host deployment (no containers)

- name: Detect Operating System
  debug:
    msg: "Detected OS Family: {{ ansible_facts['os_family'] }}, Distribution: {{ ansible_facts['distribution'] }}"

- name: Load Debian/Ubuntu Tasks
  include_tasks: debian-system.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Fail on Unsupported OS
  fail:
    msg: "Unsupported OS: {{ ansible_facts['os_family'] }}. Tier 2 supports Debian/Ubuntu only."
  when: ansible_facts['os_family'] not in ['Debian']

- name: Install and Configure OpenClaw (Tier 2 — direct host)
  include_tasks: install.yml

- name: Configure Minimal Host Security (SSH hardening)
  include_tasks: security.yml
