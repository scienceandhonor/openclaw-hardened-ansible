# ── Phase 9o: RP world events pipeline ────────────────────────────────────────
# Cross-agent interaction: RightClamp generates narrative world events from
# real-world signals (weather, music, social media); SirShellspeare weaves them
# into the RP conversation. A daily nudge job sends an unsolicited in-character
# message if the user has been idle for 12+ hours and events are pending.
# Gated on: rp_telegram_bottoken (SirShellspeare must exist).

- name: Create world-events state directory
  file:
    path: "{{ openclaw_home }}/world-events"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0755"
  when: rp_telegram_bottoken | default('') | length > 0

- name: Deploy hourly world signals collection cron
  cron:
    name: "gather-world-signals"
    minute: "45"
    job: "{{ openclaw_home }}/scripts/gather-world-signals.sh >> {{ openclaw_home }}/world-events/gather.log 2>&1; tail -c 524288 {{ openclaw_home }}/world-events/gather.log > {{ openclaw_home }}/world-events/gather.log.tmp && mv {{ openclaw_home }}/world-events/gather.log.tmp {{ openclaw_home }}/world-events/gather.log"
    user: "{{ openclaw_user }}"
    state: absent

- name: Configure RP world events jobs in OpenClaw cron
  shell: |
    python3 - <<'PYEOF'
    import json, os

    jobs_path = os.environ['HOME'] + '/.openclaw/cron/jobs.json'
    managed   = {'job-rp-world-events-morning', 'job-rp-world-events-evening', 'job-rp-world-nudge'}
    rp_on     = os.environ.get('RP_ENABLED') == '1'
    tg_on     = os.environ.get('TELEGRAM_ENABLED') == '1'
    tg_userid = os.environ.get('TELEGRAM_USERID', '')

    os.makedirs(os.path.dirname(jobs_path), exist_ok=True)

    try:
        with open(jobs_path) as f:
            store = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        store = {'version': 1, 'jobs': []}

    before = json.dumps(store, sort_keys=True)

    # Remove all managed jobs first
    store['jobs'] = [j for j in store['jobs']
                     if j.get('jobId') not in managed and j.get('id') not in managed]

    if rp_on:
        # World event generation — RightClamp agent, twice daily, silent delivery
        for job_id, expr in [('job-rp-world-events-morning', '0 10 * * *'),
                             ('job-rp-world-events-evening', '0 21 * * *')]:
            store['jobs'].append({
                'id':            job_id,
                'jobId':         job_id,
                'name':          'RP world event generation',
                'enabled':       True,
                'schedule':      {'kind': 'cron', 'expr': expr, 'staggerMs': 0},
                'sessionTarget': 'isolated',
                'wakeMode':      'now',
                'payload':       {
                    'kind':    'agentTurn',
                    'message': "Read ~/world-events/pending-signals.json. If empty, missing, or contains only '[]', stop — do nothing. Otherwise follow ~/scripts/generate-world-event-prompt.txt to generate world events."
                },
                'delivery':      {'mode': 'none'}
            })
            # World event jobs target the main agent (default) — no agentId needed

        # World nudge — SirShellspeare agent, daily evening, announces to Telegram
        if tg_on:
            store['jobs'].append({
                'id':            'job-rp-world-nudge',
                'jobId':         'job-rp-world-nudge',
                'name':          'RP world nudge',
                'enabled':       True,
                'schedule':      {'kind': 'cron', 'expr': '0 18 * * *', 'staggerMs': 0},
                'sessionTarget': 'isolated',
                'wakeMode':      'now',
                'agentId':       'sirshellspeare',
                'payload':       {
                    'kind':    'agentTurn',
                    'message': "Check ~/workspace-rp/pending-events.json. If it is missing, empty, or contains only '[]', stop — do nothing. Otherwise read ~/workspace-rp/history.json and check the timestamp of the most recent entry. If the user sent a message in the last 12 hours, stop — do nothing. If both conditions are met (pending events exist AND user has been idle 12+ hours), compose a brief in-character message from the character reacting to the world events — as if the character is reaching out unprompted. Send it via Telegram. Then clear pending-events.json (write '[]') and append any significant outcomes to ~/workspace-rp/WORLD.md with a (world) tag."
                },
                'delivery':      {'mode': 'announce', 'channel': 'telegram', 'to': tg_userid}
            })

    after = json.dumps(store, sort_keys=True)

    if before != after:
        tmp = jobs_path + '.tmp'
        with open(tmp, 'w') as f:
            json.dump(store, f, indent=2)
        os.replace(tmp, jobs_path)
        print('changed')
    else:
        print('ok')
    PYEOF
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    RP_ENABLED: '0'
    TELEGRAM_ENABLED: "{{ '1' if telegram_userid | default('') | length > 0 else '0' }}"
    TELEGRAM_USERID: "{{ telegram_userid | default('') }}"
  register: rp_world_events_result
  changed_when: "'changed' in rp_world_events_result.stdout"
  when: rp_telegram_bottoken | default('') | length > 0
  notify: Restart OpenClaw

# ── Phase 9s: Obsidian Vault Sync (git-backed, r/w) ──────────────────────────
# Gated on obsidian_repo_slug being set (--obsidian-repo user/vault).
# Mirrors the scripts-repo deploy key pattern (Phase 9a/9b/9c) but with r/w access.
# Vault cloned to ~/obsidian-vault/ and kept in sync via hourly system cron.

- name: Check if obsidian deploy key exists
  stat:
    path: "{{ openclaw_home }}/.ssh/openclaw-obsidian-deploy"
  register: obsidian_deploy_key_stat
  when: obsidian_repo_slug | default('') | length > 0

- name: Generate SSH deploy key for obsidian vault
  command: >
    ssh-keygen -t ed25519 -f "{{ openclaw_home }}/.ssh/openclaw-obsidian-deploy"
    -C "openclaw-obsidian-rw" -N ""
  become_user: "{{ openclaw_user }}"
  when: obsidian_repo_slug | default('') | length > 0 and not obsidian_deploy_key_stat.stat.exists

- name: Read obsidian deploy key public key
  slurp:
    src: "{{ openclaw_home }}/.ssh/openclaw-obsidian-deploy.pub"
  register: obsidian_deploy_pub_key
  when: obsidian_repo_slug | default('') | length > 0 and not obsidian_deploy_key_stat.stat.exists

- name: Pause — add obsidian deploy key to GitHub before continuing
  pause:
    prompt: |2+

      ============================================================
      New SSH deploy key generated for {{ obsidian_repo_slug }}

      Add this as a READ/WRITE deploy key in GitHub:
      {{ obsidian_repo_slug }} → Settings → Deploy keys → Add
      (check "Allow write access")

      {{ obsidian_deploy_pub_key.content | b64decode | trim }}

      ============================================================
      Press Enter once the deploy key has been added to GitHub
  when: obsidian_repo_slug | default('') | length > 0 and not obsidian_deploy_key_stat.stat.exists

- name: Write SSH config stanza for obsidian deploy key
  blockinfile:
    path: "{{ openclaw_home }}/.ssh/config"
    marker: "# {mark} obsidian vault deploy key"
    block: |
      Host github-obsidian-vault
          HostName github.com
          User git
          IdentityFile ~/.ssh/openclaw-obsidian-deploy
          IdentitiesOnly yes
    create: true
    owner: "{{ openclaw_user }}"
    mode: '0600'
  when: obsidian_repo_slug | default('') | length > 0

- name: Check if obsidian vault already cloned
  stat:
    path: "{{ openclaw_home }}/obsidian-vault/.git"
  register: obsidian_git_stat
  when: obsidian_repo_slug | default('') | length > 0

- name: Clone obsidian vault (first deploy)
  command: >
    git clone git@github-obsidian-vault:{{ obsidian_repo_slug }}.git
    {{ openclaw_home }}/obsidian-vault
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    GIT_SSH_COMMAND: "ssh -F {{ openclaw_home }}/.ssh/config"
  when: obsidian_repo_slug | default('') | length > 0 and not obsidian_git_stat.stat.exists

- name: Pull latest obsidian vault (re-deploy)
  command: git -C {{ openclaw_home }}/obsidian-vault pull
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    GIT_SSH_COMMAND: "ssh -F {{ openclaw_home }}/.ssh/config"
  when: obsidian_repo_slug | default('') | length > 0 and obsidian_git_stat.stat.exists

- name: Check for .obsidian/ tracked in vault git repo
  command: git -C {{ openclaw_home }}/obsidian-vault ls-files .obsidian/
  register: obsidian_tracked
  become_user: "{{ openclaw_user }}"
  changed_when: false
  failed_when: false
  when: obsidian_repo_slug | default('') | length > 0

- name: Warn if .obsidian/ is tracked in vault git repo
  debug:
    msg: >
      WARNING: .obsidian/ is tracked in the vault repo. Add workspace.json,
      workspace-mobile.json, and cache to .gitignore to avoid sync conflicts
      between agent commits and Obsidian app edits on Mac/Android.
  when: obsidian_repo_slug | default('') | length > 0 and obsidian_tracked.stdout | default('') | length > 0

- name: Create obsidian-state directory
  file:
    path: "{{ openclaw_home }}/obsidian-state"
    state: directory
    owner: "{{ openclaw_user }}"
    mode: '0755'
  when: obsidian_repo_slug | default('') | length > 0

- name: Deploy post-merge hook for obsidian vault
  copy:
    dest: "{{ openclaw_home }}/obsidian-vault/.git/hooks/post-merge"
    content: |
      #!/bin/bash
      ~/scripts/scan-obsidian-summarize.sh >> ~/obsidian-state/scan.log 2>&1
      tail -c 524288 ~/obsidian-state/scan.log > ~/obsidian-state/scan.log.tmp \
        && mv ~/obsidian-state/scan.log.tmp ~/obsidian-state/scan.log
    owner: "{{ openclaw_user }}"
    mode: '0755'
  when: obsidian_repo_slug | default('') | length > 0 and scripts_repo_slug | default('') | length > 0

- name: Create obsidian skill directory
  file:
    path: "{{ openclaw_home }}/workspace/skills/obsidian"
    state: directory
    owner: "{{ openclaw_user }}"
    mode: '0755'
  when: obsidian_repo_slug | default('') | length > 0

- name: Deploy obsidian SKILL.md
  copy:
    src: skills/obsidian/SKILL.md
    dest: "{{ openclaw_home }}/workspace/skills/obsidian/SKILL.md"
    owner: "{{ openclaw_user }}"
    mode: '0644'
    force: false
  when: obsidian_repo_slug | default('') | length > 0

- name: Hourly obsidian vault pull (system cron, :05)
  cron:
    name: "obsidian vault pull"
    minute: "5"
    hour: "*"
    job: >-
      GIT_SSH_COMMAND="ssh -i ~/.ssh/openclaw-obsidian-deploy -F ~/.ssh/config"
      git -C ~/obsidian-vault pull --ff-only origin main
      >> ~/obsidian-vault-sync.log 2>&1;
      tail -c 524288 ~/obsidian-vault-sync.log > ~/obsidian-vault-sync.log.tmp
      && mv ~/obsidian-vault-sync.log.tmp ~/obsidian-vault-sync.log
    user: "{{ openclaw_user }}"
    state: "{{ 'present' if obsidian_repo_slug | default('') | length > 0 else 'absent' }}"

- name: Hourly obsidian vault auto-commit-push (system cron, :20)
  cron:
    name: "obsidian vault push"
    minute: "20"
    hour: "*"
    job: >-
      cd ~/obsidian-vault &&
      git add . &&
      git diff --cached --quiet ||
      (git commit -m "auto: agent sync" &&
      GIT_SSH_COMMAND="ssh -i ~/.ssh/openclaw-obsidian-deploy -F ~/.ssh/config"
      git push)
      >> ~/obsidian-vault-sync.log 2>&1;
      tail -c 524288 ~/obsidian-vault-sync.log > ~/obsidian-vault-sync.log.tmp
      && mv ~/obsidian-vault-sync.log.tmp ~/obsidian-vault-sync.log
    user: "{{ openclaw_user }}"
    state: "{{ 'present' if obsidian_repo_slug | default('') | length > 0 else 'absent' }}"

# ── Phase 9t: Obsidian Link Summarize Cron ────────────────────────────────────
# Gated on both obsidian_repo_slug and scripts_repo_slug.
# Runs at :15 every hour (10 min after the vault pull at :05).
# Agent reads pending-summarize.json, fetches URLs, appends summaries, pushes.

- name: Configure obsidian link summarize job in OpenClaw cron
  shell: |
    python3 - <<'PYEOF'
    import json, os

    jobs_path = os.environ['HOME'] + '/.openclaw/cron/jobs.json'
    job_id    = 'job-obsidian-summarize'
    enable    = os.environ.get('OBSIDIAN_ENABLED') == '1' and \
                os.environ.get('SCRIPTS_ENABLED') == '1'

    os.makedirs(os.path.dirname(jobs_path), exist_ok=True)

    try:
        with open(jobs_path) as f:
            store = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        store = {'version': 1, 'jobs': []}

    before = json.dumps(store, sort_keys=True)

    store['jobs'] = [j for j in store['jobs']
                     if j.get('jobId') != job_id and j.get('id') != job_id]

    if enable:
        home = os.environ['HOME']
        store['jobs'].append({
            'id':            job_id,
            'jobId':         job_id,
            'name':          'Obsidian link summarize',
            'enabled':       True,
            'schedule':      {'kind': 'cron', 'expr': '15 * * * *', 'staggerMs': 0},
            'sessionTarget': 'isolated',
            'wakeMode':      'now',
            'payload':       {
                'kind':    'agentTurn',
                'message': f'Follow the instructions in {home}/scripts/obsidian-summarize-prompt.txt'
            },
            'delivery':      {'mode': 'none'}
        })

    after = json.dumps(store, sort_keys=True)

    if before != after:
        tmp = jobs_path + '.tmp'
        with open(tmp, 'w') as f:
            json.dump(store, f, indent=2)
        os.replace(tmp, jobs_path)
        print('changed')
    else:
        print('ok')
    PYEOF
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    OBSIDIAN_ENABLED: "{{ '1' if obsidian_repo_slug | default('') | length > 0 else '0' }}"
    SCRIPTS_ENABLED: "{{ '1' if scripts_repo_slug | default('') | length > 0 else '0' }}"
  register: obsidian_summarize_cron_result
  changed_when: "'changed' in obsidian_summarize_cron_result.stdout"
  when: obsidian_repo_slug | default('') | length > 0 and scripts_repo_slug | default('') | length > 0
  notify: Restart OpenClaw

# ── Phase 10: Security Audit ──────────────────────────────────────────────────

- name: Run initial security audit
  command: "{{ openclaw_bin.stdout }} security audit --deep"
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    OPENCLAW_GATEWAY_TOKEN: "{{ gateway_token }}"
  register: audit_result
  ignore_errors: true
  changed_when: false

- name: Show security audit results
  debug:
    msg: "{{ audit_result.stdout_lines | default([]) }}"
