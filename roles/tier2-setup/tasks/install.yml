---
# OpenClaw Tier 2 — Direct Host Install
# No containers. OpenClaw runs as a systemd service under the openclaw user.

# ── Phase 1: Node.js 22 ─────────────────────────────────────────────────────

- name: Add NodeSource APT repository (Node.js 22)
  shell: |
    curl -fsSL --connect-timeout 30 --max-time 120 https://deb.nodesource.com/setup_22.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js 22
  apt:
    name: nodejs
    state: present
    update_cache: true

- name: Verify Node.js version
  command: node --version
  register: node_version
  changed_when: false

- name: Fail if Node.js version is below 22
  fail:
    msg: "Node.js {{ node_version.stdout }} is too old — 22.12.0+ required (CVE-2026-21636)"
  when: (node_version.stdout | regex_replace('^v', '') | split('.') | first | int) < 22

# ── Phase 2: Install OpenClaw ────────────────────────────────────────────────

- name: Install OpenClaw globally (as root → /usr/bin/openclaw)
  command: npm install -g openclaw@latest
  register: npm_install_result
  changed_when: "'added' in npm_install_result.stdout or 'updated' in npm_install_result.stdout"

- name: Find openclaw binary path
  command: which openclaw
  register: openclaw_bin
  changed_when: false

- name: Show openclaw binary path
  debug:
    msg: "openclaw installed at: {{ openclaw_bin.stdout }}"

# ── Phase 3: Directory Structure ─────────────────────────────────────────────

- name: Create openclaw config and workspace directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ openclaw_home }}/.openclaw",                          mode: '0700' }
    - { path: "{{ openclaw_home }}/.openclaw/credentials",              mode: '0700' }
    - { path: "{{ openclaw_home }}/workspace",                          mode: '0755' }
    - { path: "{{ openclaw_home }}/clawd",                              mode: '0700' }


# ── Phase 4: Gateway Token ────────────────────────────────────────────────────

- name: Check if gateway token already exists
  stat:
    path: "{{ openclaw_home }}/.openclaw/gateway.token"
  register: token_file

- name: Read existing gateway token
  slurp:
    src: "{{ openclaw_home }}/.openclaw/gateway.token"
  register: existing_token_content
  when: token_file.stat.exists

- name: Generate gateway token (first deploy)
  command: openssl rand -hex 24
  register: gateway_token_gen
  when: not token_file.stat.exists

- name: Set gateway token fact
  set_fact:
    gateway_token: "{{ (existing_token_content.content | b64decode | trim) if token_file.stat.exists else gateway_token_gen.stdout | trim }}"

- name: Persist gateway token
  copy:
    content: "{{ gateway_token }}"
    dest: "{{ openclaw_home }}/.openclaw/gateway.token"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0600'

# ── Phase 5: Deploy Hardened Config Files ────────────────────────────────────

- name: Get Tailscale self DNS name
  shell: tailscale status --json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['Self']['DNSName'].rstrip('.'))"
  register: tailscale_self_dns
  changed_when: false
  failed_when: false

- name: Set tailscale_self_hostname fact
  set_fact:
    tailscale_self_hostname: "{{ tailscale_self_dns.stdout | trim }}"
  when: tailscale_self_dns.rc == 0 and tailscale_self_dns.stdout | trim | length > 0

- name: Deploy openclaw.json (gateway + provider + DM policy)
  template:
    src: openclaw.json.j2
    dest: "{{ openclaw_home }}/.openclaw/openclaw.json"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0600'
  notify: Restart OpenClaw

- name: Deploy tools.yaml (shell + filesystem allowlist)
  template:
    src: tools.yaml.j2
    dest: "{{ openclaw_home }}/.openclaw/tools.yaml"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0600'

- name: Deploy mcp.json (memory server only)
  template:
    src: mcp.json.j2
    dest: "{{ openclaw_home }}/.openclaw/mcp.json"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0600'

- name: Deploy exec-approvals.json (binary allowlist)
  template:
    src: exec-approvals.json.j2
    dest: "{{ openclaw_home }}/.openclaw/exec-approvals.json"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0600'

# ── Phase 5: Systemd Service ──────────────────────────────────────────────────
# We write the unit file directly rather than using `openclaw onboard --install-daemon`
# so the playbook stays idempotent and the service definition is version-controlled.

- name: Create openclaw systemd service
  copy:
    dest: /etc/systemd/system/openclaw.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=OpenClaw Agent Gateway
      Documentation=https://openclaw.io
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ openclaw_user }}
      Group={{ openclaw_user }}
      WorkingDirectory={{ openclaw_home }}
      Environment=HOME={{ openclaw_home }}
      Environment=OPENCLAW_GATEWAY_TOKEN={{ gateway_token }}
      Environment=NODE_OPTIONS=--no-network-family-autoselection
      ExecStart={{ openclaw_bin.stdout }} gateway run
      Restart=on-failure
      RestartSec=15
      StartLimitIntervalSec=120
      StartLimitBurst=4
      KillMode=control-group
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd and enable openclaw service
  systemd:
    name: openclaw
    daemon_reload: true
    enabled: true
    state: started

# ── Phase 6: Doctor Fix ──────────────────────────────────────────────────────
# Runs openclaw's self-repair after first start to resolve any init issues.

- name: Run openclaw doctor fix
  command: "{{ openclaw_bin.stdout }} doctor --fix --yes --non-interactive"
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    OPENCLAW_GATEWAY_TOKEN: "{{ gateway_token }}"
  register: doctor_result
  ignore_errors: true
  changed_when: false

- name: Show doctor output
  debug:
    msg: "{{ doctor_result.stdout_lines | default([]) + doctor_result.stderr_lines | default([]) }}"

# ── Doctor cleanup: remove user-level service doctor may have installed ────────
# openclaw doctor --fix registers a user-level openclaw-gateway.service as part
# of self-repair. This conflicts with our system-level service on port 18789,
# causing a 20-second restart loop. We explicitly remove it.

- name: Get openclaw user UID
  command: id -u {{ openclaw_user }}
  register: openclaw_uid
  changed_when: false

- name: Stop and disable user-level openclaw-gateway service (if installed by doctor)
  shell: |
    systemctl --user stop openclaw-gateway.service 2>/dev/null || true
    systemctl --user disable openclaw-gateway.service 2>/dev/null || true
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ openclaw_uid.stdout }}"
  failed_when: false
  changed_when: false

- name: Remove user-level openclaw systemd service files installed by doctor
  file:
    path: "{{ openclaw_home }}/.config/systemd/user/{{ item }}"
    state: absent
  become: true
  become_user: "{{ openclaw_user }}"
  loop:
    - openclaw-gateway.service
    - openclaw.service

# ── Phase 7: Wait for Gateway ────────────────────────────────────────────────

- name: Wait for OpenClaw gateway to be ready on localhost
  shell: curl -sf http://127.0.0.1:18789 > /dev/null
  register: gateway_ready
  retries: 20
  delay: 3
  until: gateway_ready.rc == 0
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"

- name: Verify gateway is bound to localhost only
  shell: ss -tlnp | grep 18789
  register: gateway_bind_check
  changed_when: false
  failed_when: "'0.0.0.0:18789' in gateway_bind_check.stdout"


# ── Phase 8: Tailscale Serve (HTTPS via Tailscale) ───────────────────────────
# Exposes the gateway at https://<hostname>.ts.net without opening any public port.
# Tailscale Serve manages TLS termination and certificate provisioning.

- name: Configure Tailscale Serve for OpenClaw gateway
  command: tailscale serve --bg 18789
  register: tailscale_serve_result
  changed_when: "'Serve started' in tailscale_serve_result.stderr or 'Serve started' in tailscale_serve_result.stdout"
  failed_when: >
    tailscale_serve_result.rc != 0 and
    'already serving' not in (tailscale_serve_result.stderr | default('') + tailscale_serve_result.stdout | default(''))

- name: Show Tailscale Serve status
  debug:
    msg: "{{ tailscale_serve_result.stdout_lines | default([]) + tailscale_serve_result.stderr_lines | default([]) }}"

# ── Phase 9: Security Monitoring + Scripts Repo ───────────────────────────────

- name: Set OPENCLAW_GATEWAY_TOKEN in openclaw user .bashrc
  lineinfile:
    path: "{{ openclaw_home }}/.bashrc"
    regexp: '^export OPENCLAW_GATEWAY_TOKEN='
    line: "export OPENCLAW_GATEWAY_TOKEN={{ gateway_token }}"
    create: true
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0600'

# ── Phase 9a: SSH Deploy Key (idempotent) ─────────────────────────────────────

- name: Check if scripts deploy key exists
  stat:
    path: "{{ openclaw_home }}/.ssh/openclaw-scripts-deploy"
  register: deploy_key_stat
  when: scripts_repo_slug | default('') | length > 0

- name: Generate SSH deploy key for scripts repo
  command: >
    ssh-keygen -t ed25519 -f "{{ openclaw_home }}/.ssh/openclaw-scripts-deploy"
    -C "openclaw-scripts-ro" -N ""
  become_user: "{{ openclaw_user }}"
  when: scripts_repo_slug | default('') | length > 0 and not deploy_key_stat.stat.exists

- name: Read deploy key public key
  slurp:
    src: "{{ openclaw_home }}/.ssh/openclaw-scripts-deploy.pub"
  register: deploy_pub_key
  when: scripts_repo_slug | default('') | length > 0 and not deploy_key_stat.stat.exists

- name: Pause — add deploy key to GitHub before continuing
  pause:
    prompt: |2+

      ============================================================
      New SSH deploy key generated for {{ scripts_repo_slug }}

      Add this as a READ-ONLY deploy key in GitHub:
      {{ scripts_repo_slug }} → Settings → Deploy keys → Add

      {{ deploy_pub_key.content | b64decode | trim }}

      ============================================================
      Press Enter once the deploy key has been added to GitHub
  when: scripts_repo_slug | default('') | length > 0 and not deploy_key_stat.stat.exists

# ── Phase 9b: SSH Config and Known Hosts ──────────────────────────────────────

- name: Fetch github.com SSH host key
  command: ssh-keyscan -t ed25519 github.com
  register: github_keyscan
  delegate_to: localhost
  become: false
  changed_when: false
  when: scripts_repo_slug | default('') | length > 0

- name: Set github_ssh_host_key fact
  set_fact:
    github_ssh_host_key: "{{ github_keyscan.stdout | trim }}"
  when: scripts_repo_slug | default('') | length > 0

- name: Add github.com to known_hosts
  known_hosts:
    name: github.com
    key: "{{ github_ssh_host_key }}"
    path: "{{ openclaw_home }}/.ssh/known_hosts"
  when: scripts_repo_slug | default('') | length > 0

- name: Write SSH config stanza for scripts deploy key
  blockinfile:
    path: "{{ openclaw_home }}/.ssh/config"
    marker: "# {mark} clamps-tools deploy key"
    block: |
      Host github-clamps-tools
          HostName github.com
          User git
          IdentityFile ~/.ssh/openclaw-scripts-deploy
          IdentitiesOnly yes
    create: true
    owner: "{{ openclaw_user }}"
    mode: '0600'
  when: scripts_repo_slug | default('') | length > 0

# ── Phase 9c: Clone or Pull Scripts Repo ──────────────────────────────────────

- name: Check if scripts repo already cloned
  stat:
    path: "{{ openclaw_home }}/scripts/.git"
  register: scripts_git_stat
  when: scripts_repo_slug | default('') | length > 0

- name: Clone scripts repo (first deploy)
  command: >
    git clone git@github-clamps-tools:{{ scripts_repo_slug }}.git
    {{ openclaw_home }}/scripts
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    GIT_SSH_COMMAND: "ssh -F {{ openclaw_home }}/.ssh/config"
  when: scripts_repo_slug | default('') | length > 0 and not scripts_git_stat.stat.exists

- name: Pull latest scripts (re-deploy)
  command: git -C {{ openclaw_home }}/scripts pull
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    GIT_SSH_COMMAND: "ssh -F {{ openclaw_home }}/.ssh/config"
  when: scripts_repo_slug | default('') | length > 0 and scripts_git_stat.stat.exists

# ── Phase 9d: Render scripts-config.env ───────────────────────────────────────

- name: Render scripts-config.env
  template:
    src: scripts-config.env.j2
    dest: "{{ openclaw_home }}/scripts-config.env"
    owner: "{{ openclaw_user }}"
    mode: '0600'

# ── Phase 9e: Cron Jobs ────────────────────────────────────────────────────────

- name: Daily git pull for scripts repo
  cron:
    name: "scripts repo pull"
    hour: "4"
    minute: "0"
    job: "GIT_SSH_COMMAND='ssh -F ~/.ssh/config' git -C ~/scripts pull >> ~/scripts-pull.log 2>&1"
    user: "{{ openclaw_user }}"
  when: scripts_repo_slug | default('') | length > 0

- name: Weekly security monitor
  cron:
    name: "OpenClaw security audit"
    minute: "0"
    hour: "9"
    weekday: "0"
    job: "~/scripts/monitor-openclaw.sh >> ~/security-audit-cron.log 2>&1"
    user: "{{ openclaw_user }}"
  when: scripts_repo_slug | default('') | length > 0

- name: Remove Last.fm artist sync from system cron (now managed by OpenClaw cron)
  cron:
    name: "Last.fm artist sync"
    user: "{{ openclaw_user }}"
    state: absent

- name: Configure Last.fm artist sync in OpenClaw cron
  shell: |
    python3 - <<'PYEOF'
    import json, os

    jobs_path = os.environ['HOME'] + '/.openclaw/cron/jobs.json'
    job_id    = 'job-lastfm-sync'
    enable    = os.environ.get('LASTFM_ENABLED') == '1'

    os.makedirs(os.path.dirname(jobs_path), exist_ok=True)

    try:
        with open(jobs_path) as f:
            store = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        store = {'version': 1, 'jobs': []}

    before = json.dumps(store, sort_keys=True)

    store['jobs'] = [j for j in store['jobs'] if j.get('jobId') != job_id]

    if enable:
        store['jobs'].append({
            'id':            job_id,
            'jobId':         job_id,
            'name':          'Last.fm artist sync',
            'enabled':       True,
            'schedule':      {'kind': 'cron', 'expr': '0 */3 * * *', 'staggerMs': 0},
            'sessionTarget': 'isolated',
            'wakeMode':      'now',
            'payload':       {
                'kind':    'agentTurn',
                'message': 'Run ~/scripts/fetch-lastfm-artists.sh to sync Last.fm recently played artists. Report how many new artists were added.'
            },
            'delivery':      {'mode': 'none'}
        })

    after = json.dumps(store, sort_keys=True)

    if before != after:
        tmp = jobs_path + '.tmp'
        with open(tmp, 'w') as f:
            json.dump(store, f, indent=2)
        os.replace(tmp, jobs_path)
        print('changed')
    else:
        print('ok')
    PYEOF
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    LASTFM_ENABLED: "{{ '1' if (lastfm_api_key | default('') | length > 0 and lastfm_username | default('') | length > 0) else '0' }}"
  register: lastfm_cron_result
  changed_when: "'changed' in lastfm_cron_result.stdout"
  when: scripts_repo_slug | default('') | length > 0
  notify: Restart OpenClaw

- name: Weekly bandcheck corpus refresh
  cron:
    name: "bandcheck corpus refresh"
    minute: "0"
    hour: "7"
    weekday: "1"
    job: "~/scripts/refresh-bandcheck-corpus.sh >> ~/bandcheck-corpus-cron.log 2>&1"
    user: "{{ openclaw_user }}"
  when: >
    scripts_repo_slug | default('') | length > 0 and
    lastfm_api_key | default('') | length > 0

- name: Configure band check in OpenClaw cron
  shell: |
    python3 - <<'PYEOF'
    import json, os

    jobs_path = os.environ['HOME'] + '/.openclaw/cron/jobs.json'
    job_id    = 'job-band-check'
    enable    = os.environ.get('BANDCHECK_ENABLED') == '1'

    os.makedirs(os.path.dirname(jobs_path), exist_ok=True)

    try:
        with open(jobs_path) as f:
            store = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        store = {'version': 1, 'jobs': []}

    before = json.dumps(store, sort_keys=True)

    store['jobs'] = [j for j in store['jobs'] if j.get('jobId') != job_id]

    if enable:
        tg_on = os.environ.get('TELEGRAM_ENABLED') == '1'
        store['jobs'].append({
            'id':            job_id,
            'jobId':         job_id,
            'name':          'Band NSBM check',
            'enabled':       True,
            'schedule':      {'kind': 'cron', 'expr': '0 8 * * *', 'staggerMs': 0},
            'sessionTarget': 'isolated',
            'wakeMode':      'now',
            'payload':       {
                'kind':    'agentTurn',
                'message': 'Run ~/scripts/check-bands.sh then follow the instructions in ~/scripts/bandcheck-prompt.txt'
            },
            'delivery':      {'mode': 'channel' if tg_on else 'none'}
        })

    after = json.dumps(store, sort_keys=True)

    if before != after:
        tmp = jobs_path + '.tmp'
        with open(tmp, 'w') as f:
            json.dump(store, f, indent=2)
        os.replace(tmp, jobs_path)
        print('changed')
    else:
        print('ok')
    PYEOF
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    BANDCHECK_ENABLED: "{{ '1' if (scripts_repo_slug | default('') | length > 0 and lastfm_api_key | default('') | length > 0) else '0' }}"
    TELEGRAM_ENABLED: "{{ '1' if telegram_userid | default('') | length > 0 else '0' }}"
  register: bandcheck_cron_result
  changed_when: "'changed' in bandcheck_cron_result.stdout"
  when: scripts_repo_slug | default('') | length > 0
  notify: Restart OpenClaw

# ── Phase 9f: Substack Email Digest ──────────────────────────────────────────
# Fetch and digest are split into separate jobs:
#   - Hourly system cron: runs the IMAP poller, appends new emails to
#     email-state/undigested.json (no agent involved).
#   - OpenClaw cron at 12:45 and 19:45 server time (= 11:45 and 18:45 Berlin,
#     server is in Finland = UTC+2/+3, Berlin = UTC+1/+2, offset is constant):
#     agent reads + clears undigested.json and sends the digest via Telegram.
#
# Scripts live in clamps-tools (Phase 9a-9c). --scripts-repo is required when
# email is configured; deploy-tier2.sh enforces this before the playbook runs.

- name: Create email state directory
  file:
    path: "{{ openclaw_home }}/.openclaw/email-state"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0700'
  when: email_imap_host | default('') | length > 0

- name: Hourly Substack email fetch (system cron, no agent)
  cron:
    name: "Substack email fetch"
    minute: "0"
    hour: "*"
    job: "~/scripts/run-substack-check.sh >> ~/.openclaw/email-state/fetch.log 2>&1; tail -c 1048576 ~/.openclaw/email-state/fetch.log > ~/.openclaw/email-state/fetch.log.tmp && mv ~/.openclaw/email-state/fetch.log.tmp ~/.openclaw/email-state/fetch.log"
    user: "{{ openclaw_user }}"
    state: "{{ 'present' if email_imap_host | default('') | length > 0 else 'absent' }}"

- name: Configure Substack digest jobs in OpenClaw cron
  shell: |
    python3 - <<'PYEOF'
    import json, os

    jobs_path = os.environ['HOME'] + '/.openclaw/cron/jobs.json'
    enable    = os.environ.get('SUBSTACK_ENABLED') == '1'
    tg_on     = os.environ.get('TELEGRAM_ENABLED') == '1'

    # job IDs managed by this task (also cleans up the old combined job)
    managed = {'substack-email-digest', 'substack-digest-morning', 'substack-digest-evening'}

    os.makedirs(os.path.dirname(jobs_path), exist_ok=True)

    try:
        with open(jobs_path) as f:
            store = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        store = {'version': 1, 'jobs': []}

    before = json.dumps(store, sort_keys=True)

    store['jobs'] = [j for j in store['jobs'] if j.get('jobId') not in managed]

    if enable:
        delivery = {'mode': 'channel' if tg_on else 'none'}
        message  = 'Run ~/scripts/run-substack-digest.sh then follow the instructions in ~/scripts/substack-prompt.txt'
        for job_id, name, expr in [
            ('substack-digest-morning', 'Substack digest (morning)', '45 6 * * *'),
            ('substack-digest-evening', 'Substack digest (evening)', '45 10 * * *'),
        ]:
            store['jobs'].append({
                'id':            job_id,
                'jobId':         job_id,
                'name':          name,
                'enabled':       True,
                'schedule':      {'kind': 'cron', 'expr': expr, 'staggerMs': 0},
                'sessionTarget': 'isolated',
                'wakeMode':      'now',
                'payload':       {'kind': 'agentTurn', 'message': message},
                'delivery':      delivery,
            })

    after = json.dumps(store, sort_keys=True)

    if before != after:
        tmp = jobs_path + '.tmp'
        with open(tmp, 'w') as f:
            json.dump(store, f, indent=2)
        os.replace(tmp, jobs_path)
        print('changed')
    else:
        print('ok')
    PYEOF
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    SUBSTACK_ENABLED: "{{ '1' if email_imap_host | default('') | length > 0 else '0' }}"
    TELEGRAM_ENABLED: "{{ '1' if telegram_userid | default('') | length > 0 else '0' }}"
  register: substack_cron_result
  changed_when: "'changed' in substack_cron_result.stdout"
  notify: Restart OpenClaw

# ── Phase 9g: Daily Stoic Quote ──────────────────────────────────────────────
# Isolated agent job at 6:45 UTC (= 7:45 Berlin in winter) — runs daily-stoic.py
# and delivers the quote to the Telegram channel.

- name: Configure daily stoic quote in OpenClaw cron
  shell: |
    python3 - <<'PYEOF'
    import json, os

    jobs_path = os.environ['HOME'] + '/.openclaw/cron/jobs.json'
    job_id    = 'job-daily-stoic'
    enable    = os.environ.get('STOIC_ENABLED') == '1'
    tg_on     = os.environ.get('TELEGRAM_ENABLED') == '1'

    os.makedirs(os.path.dirname(jobs_path), exist_ok=True)

    try:
        with open(jobs_path) as f:
            store = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        store = {'version': 1, 'jobs': []}

    before = json.dumps(store, sort_keys=True)

    store['jobs'] = [j for j in store['jobs'] if j.get('jobId') != job_id]

    if enable:
        store['jobs'].append({
            'id':            job_id,
            'jobId':         job_id,
            'name':          'Daily stoic quote',
            'enabled':       True,
            'schedule':      {'kind': 'cron', 'expr': '45 6 * * *', 'staggerMs': 0},
            'sessionTarget': 'isolated',
            'wakeMode':      'now',
            'payload':       {
                'kind':    'agentTurn',
                'message': 'Run ~/scripts/daily-stoic.py and reply with only its output.'
            },
            'delivery':      {'mode': 'channel' if tg_on else 'none'}
        })

    after = json.dumps(store, sort_keys=True)

    if before != after:
        tmp = jobs_path + '.tmp'
        with open(tmp, 'w') as f:
            json.dump(store, f, indent=2)
        os.replace(tmp, jobs_path)
        print('changed')
    else:
        print('ok')
    PYEOF
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    STOIC_ENABLED: "{{ '1' if scripts_repo_slug | default('') | length > 0 else '0' }}"
    TELEGRAM_ENABLED: "{{ '1' if telegram_userid | default('') | length > 0 else '0' }}"
  register: stoic_cron_result
  changed_when: "'changed' in stoic_cron_result.stdout"
  when: scripts_repo_slug | default('') | length > 0
  notify: Restart OpenClaw

# ── Phase 10: Security Audit ──────────────────────────────────────────────────

- name: Run initial security audit
  command: "{{ openclaw_bin.stdout }} security audit --deep"
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    OPENCLAW_GATEWAY_TOKEN: "{{ gateway_token }}"
  register: audit_result
  ignore_errors: true
  changed_when: false

- name: Show security audit results
  debug:
    msg: "{{ audit_result.stdout_lines | default([]) }}"
