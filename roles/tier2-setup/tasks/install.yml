# ── Phase 9o: Weekly OpenClaw feature tips (Friday) ───────────────────────────
# Every Friday at 19:00 UTC (20:00 Berlin CET) the main agent inspects the live config, picks one
# underused or unconfigured feature, suggests it on Telegram, and logs the
# suggestion in ~/feature-tips-state/suggested.json to avoid repeats.
# On Monday at 17:00 UTC (18:00 Berlin CET) a follow-up nudge reminds the user
# to try the feature suggested on Friday.
# Prompts live in ~/scripts/ (deployed via clamps-tools).
# Always runs on the main agent (no PINCERMOVE routing).

- name: Create feature-tips state directory
  file:
    path: "{{ openclaw_home }}/feature-tips-state"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0700'
  when: telegram_userid | default('') | length > 0

- name: Configure weekly Friday OpenClaw feature tips job in OpenClaw cron
  shell: |
    python3 - <<'PYEOF'
    import json, os

