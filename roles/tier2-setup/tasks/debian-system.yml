---
# Debian/Ubuntu System Setup (Tier 2 — no Podman)

- name: Update Apt Cache and Upgrade System
  apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install needrestart
  apt:
    name: needrestart
    state: present

- name: Check if kernel reboot is required
  command: needrestart -b -k
  register: needrestart_result
  changed_when: false
  failed_when: false

- name: Reboot if required
  reboot:
    msg: "Rebooting to apply system updates"
  when: "'HAS_NEWER_KERNEL' in needrestart_result.stdout or needrestart_result.rc == 2"

- name: Install Essential Tools
  apt:
    name:
      - git
      - unattended-upgrades
      - openssh-server
      - sudo
      - curl
      - gnupg
      - jq
      - lsb-release
    state: present

- name: Enable automatic security updates
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Tailscale Installation
- name: Add Tailscale GPG Key
  shell: |
    curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).noarmor.gpg | tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
  args:
    creates: /usr/share/keyrings/tailscale-archive-keyring.gpg
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Add Tailscale Repository (Ubuntu)
  shell: |
    curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).tailscale-keyring.list | tee /etc/apt/sources.list.d/tailscale.list
  args:
    creates: /etc/apt/sources.list.d/tailscale.list
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Add Tailscale Repository (Debian)
  shell: |
    curl -fsSL https://pkgs.tailscale.com/stable/debian/$(lsb_release -cs).tailscale-keyring.list | tee /etc/apt/sources.list.d/tailscale.list
  args:
    creates: /etc/apt/sources.list.d/tailscale.list
  when: ansible_facts['distribution'] == 'Debian'

- name: Update Apt Cache (Tailscale)
  apt:
    update_cache: true

- name: Install Tailscale
  apt:
    name: tailscale
    state: present

# User Setup
- name: Create OpenClaw User
  user:
    name: "{{ openclaw_user }}"
    comment: "OpenClaw Service User"
    shell: /bin/bash
    create_home: true
    home: "{{ openclaw_home }}"
    state: present

- name: Authorize SSH Key for OpenClaw User
  authorized_key:
    user: "{{ openclaw_user }}"
    state: present
    key: "{{ deploy_public_key }}"

- name: Setup OpenClaw .ssh Directory
  file:
    path: "{{ openclaw_home }}/.ssh"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0700'

# Tailscale (with interactive auth pause)
- name: Start and Enable Tailscale
  systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Check Tailscale Status
  command: tailscale status
  register: tailscale_status
  ignore_errors: true
  changed_when: false

- name: Start Tailscale login
  shell: tailscale up --ssh 2>&1 || true
  when: tailscale_status.rc != 0 or 'Logged out' in (tailscale_status.stdout | default(''))
  async: 300
  poll: 0
  register: tailscale_login_job

- name: Get Tailscale auth URL
  shell: |
    for i in $(seq 1 30); do
      URL=$(tailscale status --json 2>/dev/null | python3 -c "
    import sys, json
    try:
        data = json.load(sys.stdin)
        url = data.get('AuthURL', '')
        if url:
            print(url)
    except Exception as e:
        print(f'ERROR: Failed to parse tailscale status JSON: {e}', file=sys.stderr)
    ")
      if [ -n "$URL" ]; then
        echo "$URL"
        exit 0
      fi
      sleep 2
    done
    echo "ERROR: Could not retrieve Tailscale auth URL"
    exit 1
  register: tailscale_auth_url
  when: tailscale_login_job is not skipped

- name: Authenticate Tailscale
  pause:
    prompt: |

      ========================================================
      TAILSCALE AUTHENTICATION REQUIRED
      ========================================================

      Open this URL in your browser to add the VPS to your tailnet:

      {{ tailscale_auth_url.stdout }}

      Press ENTER once you have authenticated...
      ========================================================
  when: tailscale_login_job is not skipped and tailscale_auth_url.rc == 0

- name: Wait for Tailscale login to complete
  async_status:
    jid: "{{ tailscale_login_job.ansible_job_id }}"
  register: tailscale_login_result
  until: tailscale_login_result.finished
  retries: 60
  delay: 5
  when: tailscale_login_job is not skipped

- name: Verify Tailscale connection
  command: tailscale status
  register: tailscale_final_status
  changed_when: false

- name: Show Tailscale status
  debug:
    msg: "{{ tailscale_final_status.stdout_lines }}"
