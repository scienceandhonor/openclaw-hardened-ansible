---
# Arch System Setup

- name: Update Pacman Cache and System
  community.general.pacman:
    update_cache: true
    upgrade: true

- name: Install pacman-contrib (Arch)
  community.general.pacman:
    name: pacman-contrib
    state: present

- name: Check if kernel reboot is required (checkreboot)
  command: /usr/bin/checkreboot
  register: checkreboot_result
  changed_when: false
  failed_when: false

- name: Reboot if kernel was updated (checkreboot)
  reboot:
    msg: "Kernel updated. Rebooting now."
  when: checkreboot_result.rc == 1

- name: Install Essential Tools (Host)
  community.general.pacman:
    name:
      - git
      - vim
      - ufw
      - fail2ban
      - openssh
      - tailscale
      - podman
      - podman-compose
      - sudo
    state: present

- name: Create OpenClaw User
  user:
    name: "{{ openclaw_user }}"
    comment: "OpenClaw Service User"
    shell: /bin/bash
    create_home: true
    home: "{{ openclaw_home }}"
    state: present

- name: Authorize New SSH Key for OpenClaw User
  authorized_key:
    user: "{{ openclaw_user }}"
    state: present
    key: "{{ deploy_public_key }}"

- name: Setup OpenClaw .ssh Directory
  file:
    path: "{{ openclaw_home }}/.ssh"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: '0700'

# Rootless Podman Setup
- name: Enable Lingering for OpenClaw User
  command: "loginctl enable-linger {{ openclaw_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ openclaw_user }}"

- name: Start and Enable Tailscale
  systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Check Tailscale Status
  command: tailscale status
  register: tailscale_status
  ignore_errors: true
  changed_when: false

- name: Start Tailscale login
  shell: tailscale up --ssh 2>&1 || true
  when: tailscale_status.rc != 0 or 'Logged out' in (tailscale_status.stdout | default(''))
  async: 300
  poll: 0
  register: tailscale_login_job

- name: Get Tailscale auth URL
  shell: |
    for i in $(seq 1 30); do
      URL=$(tailscale status --json 2>/dev/null | python3 -c "
    import sys, json
    try:
        data = json.load(sys.stdin)
        url = data.get('AuthURL', '')
        if url:
            print(url)
    except Exception as e:
        print(f'ERROR: Failed to parse tailscale status JSON: {e}', file=sys.stderr)
    ")
      if [ -n "$URL" ]; then
        echo "$URL"
        exit 0
      fi
      sleep 2
    done
    echo "ERROR: Could not retrieve Tailscale auth URL"
    exit 1
  register: tailscale_auth_url
  when: tailscale_login_job is not skipped

- name: Authenticate Tailscale
  pause:
    prompt: |

      ========================================================
      TAILSCALE AUTHENTICATION REQUIRED
      ========================================================

      Open this URL in your browser to add the VPS to your tailnet:

      {{ tailscale_auth_url.stdout }}

      Press ENTER once you have authenticated...
      ========================================================
  when: tailscale_login_job is not skipped and tailscale_auth_url.rc == 0

- name: Wait for Tailscale login to complete
  async_status:
    jid: "{{ tailscale_login_job.ansible_job_id }}"
  register: tailscale_login_result
  until: tailscale_login_result.finished
  retries: 60
  delay: 5
  when: tailscale_login_job is not skipped

- name: Verify Tailscale connection
  command: tailscale status
  register: tailscale_final_status
  changed_when: false

- name: Show Tailscale status
  debug:
    msg: "{{ tailscale_final_status.stdout_lines }}"
